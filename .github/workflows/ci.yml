name: FraudShield AI CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ──────────────────────────────────────────────────────────────────
  # ML Pipeline: Lint + Type Check + Tests
  # ──────────────────────────────────────────────────────────────────
  ml-tests:
    name: ML Pipeline Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with Ruff
        run: pip install ruff && ruff check pipeline/ tests/

      - name: Type check with mypy
        run: pip install mypy && mypy pipeline/ --ignore-missing-imports

      - name: Run ML tests with coverage
        run: |
          pytest tests/ -v \
            --cov=pipeline \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=70

      - name: Upload ML coverage
        uses: codecov/codecov-action@v4
        with:
          files: ml/coverage.xml
          flags: ml

  # ──────────────────────────────────────────────────────────────────
  # Backend: Lint + Type Check + Tests
  # ──────────────────────────────────────────────────────────────────
  api-tests:
    name: Backend API Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fraudshield_test
          POSTGRES_PASSWORD: fraudshield_test
          POSTGRES_DB: fraudshield_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql+asyncpg://fraudshield_test:fraudshield_test@localhost:5432/fraudshield_test
      SECRET_KEY: ci_test_secret_key_not_for_production
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with Ruff
        run: pip install ruff && ruff check app/ tests/

      - name: Type check with mypy
        run: pip install mypy && mypy app/ --ignore-missing-imports

      - name: Run API tests with coverage
        run: |
          pytest tests/ -v \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=70

      - name: Upload API coverage
        uses: codecov/codecov-action@v4
        with:
          files: apps/api/coverage.xml
          flags: api

  # ──────────────────────────────────────────────────────────────────
  # Frontend: Lint + Type Check + Build
  # ──────────────────────────────────────────────────────────────────
  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_APP_NAME: FraudShield AI
        run: npm run build

  # ──────────────────────────────────────────────────────────────────
  # Docker: Build all images
  # ──────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [ml-tests, api-tests, frontend-checks]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.api
          push: false
          tags: fraudshield-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web image
        uses: docker/build-push-action@v5
        with:
          context: apps/web
          file: infra/docker/Dockerfile.web
          push: false
          tags: fraudshield-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
