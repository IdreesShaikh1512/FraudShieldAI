services:
  # ──────────────────────────────────────────────────
  # PostgreSQL 16 Database
  # ──────────────────────────────────────────────────
  fraudshield-db:
    image: postgres:16-alpine
    container_name: fraudshield-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fraudshield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fraudshield_secret}
      POSTGRES_DB: ${POSTGRES_DB:-fraudshield}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fraudshield} -d ${POSTGRES_DB:-fraudshield}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - fraudshield-network

  # ──────────────────────────────────────────────────
  # FastAPI Backend
  # ──────────────────────────────────────────────────
  fraudshield-api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: fraudshield-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fraudshield}:${POSTGRES_PASSWORD:-fraudshield_secret}@fraudshield-db:5432/${POSTGRES_DB:-fraudshield}
      SECRET_KEY: ${SECRET_KEY:-dev_secret_change_in_production}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      MODEL_DIR: /app/ml/models
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./ml/models:/app/ml/models:ro   # Mount trained models as read-only
      - ./ml/data/demo:/app/ml/data/demo:ro
    ports:
      - "8000:8000"
    depends_on:
      fraudshield-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - fraudshield-network

  # ──────────────────────────────────────────────────
  # Next.js Frontend
  # ──────────────────────────────────────────────────
  fraudshield-web:
    build:
      context: apps/web
      dockerfile: ../../infra/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_APP_NAME: "FraudShield AI"
    container_name: fraudshield-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      fraudshield-api:
        condition: service_healthy
    networks:
      - fraudshield-network

volumes:
  postgres_data:
    name: fraudshield_postgres_data

networks:
  fraudshield-network:
    name: fraudshield-network
    driver: bridge
